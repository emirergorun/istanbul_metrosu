name: istanbul_metro_game
description: "İstanbul Metrosu Oyunu — yolculuk süresine göre ayarlanan, offline oynanabilen blok yerleştirme oyunu."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

# MVP dependency felsefesi: mümkün olduğunca az package.
# Analytics / ads / crash / network SDK'sı bilinçli olarak YOKTUR.
dependencies:
  flutter:
    sdk: flutter

  # Yalnızca local best score ve ayarlar için.
  shared_preferences: ^2.3.2

  # Kısa arayüz sesleri. Ses dosyaları sentezlenip pakete gömülüdür;
  # çalışma anında indirme yoktur.
  audioplayers: ^6.1.0

  # Ray Uçuşu ve Ray Değiştir'in oyun döngüleri, her karede "gerçekte ne
  # kadar süre geçti"yi ölçmek için bunu kullanır (bkz. RailFlightController,
  # LaneRunnerController). flutter_test'in kendisi package:fake_async
  # üzerine kurulu ve o da bu paketin ambient saatini tanıyor — bu sayede
  # widget testlerinde tester.pump(süre) ile zamanlayıcı, ham DateTime.now()
  # ile uyumsuz kalmadan hızlandırılabiliyor.
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Metro ağı: hatlar, istasyon sırası, durak arası süreler, hat renkleri.
    - assets/data/metro.json
    # Küratörlü bilgi soruları (Metro Bilgi oyunu): 1.200 soru, altı kategori.
    - assets/data/trivia.json
    # Sentezlenmiş arayüz sesleri.
    - assets/audio/
    # Hat Düşür arka plan sahnesi (tren içi + kutu).
    - assets/images/merge_drop_scene.png
    # Font lisans metinleri uygulama içi "Lisanslar" ekranına kaydedilir.
    - assets/fonts/OFL-Bungee.txt
    - assets/fonts/OFL-MPLUSRounded1c.txt

  # Kısa büyük başlıklarda Bungee (Türkçe `i` için `cmap` düzeltmesi
  # yapıldı), diğer her yerde M PLUS Rounded 1c. İkisi de SIL OFL 1.1.
  # Kullanım kuralları: `lib/app/theme.dart` → AppFonts.
  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: M PLUS Rounded 1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
